<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ subject }} | Kodafriq</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0A1128; color: #F1F5F9; margin: 0; padding: 30px 15px; }
        .container { max-width: 580px; margin: 0 auto; background: #111C38; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; }
        .header { background: linear-gradient(135deg, #070D1F 0%, #0D1C42 100%); padding: 24px 30px; border-bottom: 1px solid rgba(56,189,248,0.2); }
        .header-title { font-size: 18px; font-weight: 800; color: #FFFFFF; letter-spacing: 0.05em; text-transform: uppercase; }
        .header-sub { font-size: 11px; color: #38BDF8; font-weight: 700; text-transform: uppercase; }
        .content { padding: 30px; font-size: 14px; line-height: 1.6; color: #CBD5E1; }
        .content h2 { color: #FFFFFF; font-size: 18px; margin-top: 0; }
        .badge-box { background: rgba(56,189,248,0.08); border: 1px solid rgba(56,189,248,0.25); border-radius: 8px; padding: 14px 18px; margin: 18px 0; }
        .button { display: inline-block; background: linear-gradient(135deg, #1D4ED8 0%, #2563EB 50%, #0284C7 100%); color: #FFFFFF !important; font-weight: 700; font-size: 13px; text-decoration: none; padding: 12px 24px; border-radius: 8px; margin: 18px 0; }
        .footer { background: #0A1128; padding: 18px 30px; font-size: 11px; color: #64748B; text-align: center; border-top: 1px solid rgba(255,255,255,0.06); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">KODAFRIQ</div>
            <div class="header-sub">Healthcare Data Management & Talent Solutions</div>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            &copy; {{ CURRENT_YEAR }} Kodafriq. All rights reserved. • This is an automated platform notification.
        </div>
    </div>
</body>
</html>

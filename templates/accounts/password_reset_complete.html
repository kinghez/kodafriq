{% extends "base.html" %}

{% block title %}Password Reset Complete | Kodafriq{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 60px auto; padding: 36px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); text-align: center;">
    <div style="width: 56px; height: 56px; border-radius: 28px; background: #ECFDF5; border: 1px solid #A7F3D0; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; font-size: 24px; color: #059669; font-weight: bold;">
        OK
    </div>
    <h2 style="font-size: 22px; font-weight: 700; color: #0F172A; margin-top: 0; margin-bottom: 8px;">Password Updated</h2>
    <p style="font-size: 14px; color: #64748B; margin-bottom: 24px; line-height: 1.6;">
        Your password has been reset successfully. You can now sign in with your new credentials.
    </p>
    <a href="{% url 'accounts:login' %}" style="display: inline-block; background: #0066FF; color: #FFFFFF; font-weight: 600; font-size: 14px; padding: 11px 24px; border-radius: 6px; text-decoration: none;">
        Sign In Now
    </a>
</div>
{% endblock %}
